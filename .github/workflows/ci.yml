name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Git tag from version.txt
        run: |
          VERSION=$(cat version.txt)
          echo "VERSION=$VERSION"
          # Only create tag if it doesn't exist
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            echo "Created tag $VERSION"
          else
            echo "Tag $VERSION already exists, skipping"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 #v5.4.1

      - name: Install the dependencies
        run: |
          uv sync --extra ci

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

#      - name: Run pre-commit checks
#        run: |
#          uv run pre-commit run --all-files
#
#      - name: run pytest
#        run: |
#          uv run pytest

      - name: Validate Databricks bundle (dev)
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_DEV_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_DEV_CLIENT_SECRET }}
        run: |
          databricks bundle --target=dev validate

      - name: Deploy to Databricks (dev)
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_DEV_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_DEV_CLIENT_SECRET }}
        run: |
          databricks bundle --target=dev deploy

      - name: Databricks bundle summary (dev)
        if: success() && github.event_name == 'pull_request'
        env:
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_DEV_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_DEV_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(databricks bundle --target=dev bundle summary)
          gh pr comment --body "## Databricks Bundle Summary (Dev)

          \`\`\`
          $SUMMARY
          \`\`\`"
