bundle:
  name: llmops-databricks-course-sbojarovski

include:
  - resources/*.yml

variables:
  git_sha:
    description: "Git SHA of the deployed commit"
    default: "local"
  env:
    description: "Deployment environment (dev, prod, etc.)"
    default: ${bundle.target}
  user_short_name:
    description: "Short name of the user (for schema management)"
    default: ${workspace.current_user.userName}

artifacts:
  default:
    type: whl
    build: uv build --index https://pypi.org/simple/
    path: .

targets:
  local:
    mode: development
    default: true
    workspace:
      host:  https://dbc-749ee571-055f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    run_as:
      user_name: ${workspace.current_user.userName}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - service_principal_name: 57f73d1d-3240-4316-9371-bc91e010a7fb
        level: CAN_MANAGE

  dev:
    mode: development
    workspace:
      host:  https://dbc-749ee571-055f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    run_as:
      # llmops-dev
      service_principal_name: 57f73d1d-3240-4316-9371-bc91e010a7fb
    permissions:
      - user_name: bojarovski@gmail.com
        level: CAN_MANAGE
      - service_principal_name: 57f73d1d-3240-4316-9371-bc91e010a7fb
        level: CAN_MANAGE

  prod:
    workspace:
      host: https://dbc-749ee571-055f.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    run_as:
      # llmops-dev
      service_principal_name: 445fb0db-33fb-419e-af20-af280dadb9c4
    permissions:
      - service_principal_name: 445fb0db-33fb-419e-af20-af280dadb9c4
        level: CAN_MANAGE

  cauchy:
    workspace:
      host: https://dbc-b1b2f91a-d102.cloud.databricks.com/
      profile: bojarovski-cauchy
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
